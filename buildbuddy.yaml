actions:
  - name: "Build and Test all targets"
    container_image: "ubuntu-22.04"
    triggers:
      push:
        branches:
          - "master" # <-- replace "main" with your main branch name
      pull_request:
        branches:
          - "*"
    steps:
      # TODO(#209): Don't require installing graphviz
      - run: 'sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz graphviz-dev libtinfo5'
      # `aspect check` runs the lint pipeline in //.aspect/tasks/lint.axl,
      # sharing one entrypoint with local dev and the GitHub Actions job.
      - run: './tools/aspect check'
      - run: 'bazel build //...'
      - run: 'bazel test //... --output_groups=-mypy'
    resource_requests:
      # The default 20GB was too small; bumped to 40GB, then to 80GB once
      # the pigweed roll (#431) pushed bazel's own output-base/external past
      # 16GB on its own, before OS/container/git-checkout overhead.
      disk: 80GB
